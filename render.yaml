services:
  - type: web
    name: ranktel-backend
    runtime: node
    buildCommand: npm ci
    # Changed from 'npm start' to run node directly, bypassing npm's signal handling issues
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: https://ranktel.vercel.app
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SHIPPING_FEE
        value: 0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false